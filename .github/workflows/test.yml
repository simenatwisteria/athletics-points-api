name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy athletics_scoring
      - name: Sjekksummer for kildefiler
        run: cd sources && sha256sum -c SHA256SUMS
