[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "athletics-scoring"
version = "0.1.0"
description = "Åpen, transparent beregningsmotor for norske friidrettspoeng"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "httpx>=0.27",
]
# HTTP-API-et (athletics_api). athletics_scoring har fortsatt ingen avhengigheter.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Repository = "https://github.com/simenatwisteria/athletics-points-api"

[tool.hatch.build.targets.wheel]
packages = ["athletics_scoring", "athletics_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Norsk tekst bruker bevisst –, − og × (f.eks. i beregningsforklaringer).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
