  /events:
    get:
      tags: [katalog]
      operationId: listEvents
      summary: Øvelseskatalog for et system
      description: |
        Én rad per (øvelse, kjønn, klasse, utstyr). Har en øvelse flere utstyrsvarianter for samme
        klasse (for eksempel 110 m hekk G17 med 91,4 cm og 100 cm), kommer den én gang per variant,
        og da må `implement` sendes med i beregningen. Klienten grupperer menyene etter `category`.
      parameters:
        - $ref: "#/components/parameters/SystemQuery"
        - $ref: "#/components/parameters/VersionQuery"
        - name: gender
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Gender"
        - name: age_class
          in: query
          required: false
          description: Klasse i systemets eget format (se `classes` i GET /systems).
          schema:
            type: string
      responses:
        "200":
          description: Øvelsene som passer filteret.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventEntry"
              examples:
                tyrving_g15_800m:
                  summary: GET /events?system=tyrving&gender=M&age_class=15 (utdrag)
                  value:
                    - system: tyrving
                      version: "2014"
                      event_id: middle_800m
                      name:
                        "no": 800 m
                        en: 800 m
                      category: run
                      gender: M
                      age_class: "15"
                      implement: null
                      formula_type: simple_quotient
                      input:
                        measure: time
                        resolution: 0.1
                        uses_minutes: true
                        manual_timing_allowed: false
                        plausible_min: 74.4
                        plausible_max: 372.0
                      points_1000_result: 124.0
                wa_senior_200m:
                  summary: GET /events?system=wa_combined_events&gender=M&age_class=senior (utdrag)
                  value:
                    - system: wa_combined_events
                      version: "2001"
                      event_id: sprint_200m
                      name:
                        "no": 200 m
                        en: 200 m
                      category: run
                      gender: M
                      age_class: senior
                      implement: null
                      formula_type: track
                      input:
                        measure: time
                        resolution: 0.01
                        uses_minutes: false
                        manual_timing_allowed: true
                        plausible_min: 12.52
                        plausible_max: 62.59
                      points_1000_result: 20.86
