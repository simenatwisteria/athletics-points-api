# API-kontrakt v1 for athletics-points-api (AP-020). Lesbar oversikt: docs/api/README.md.
# Fila holder seg innenfor YAML-utsnittet i scripts/openapi_check.py (ingen flyt-mappinger, ingen
# kommentarer på samme linje som en verdi). Kontroll: python scripts/openapi_check.py
openapi: 3.1.0
info:
  title: Athletics Points API
  version: 1.0.0-draft
  summary: Åpen, transparent beregning av norske friidrettspoeng.
  description: |
    Beregner poeng etter Tyrvingtabellen 2014, IAAF/WA Scoring Tables for Combined Events (2001),
    NFIFs masters-mangekamp (WMA 2023) og WMA Age Grading 2023. Hver beregning returnerer
    stegene med `ref` til et beregningsvalg (BV-nummer i docs/BEREGNINGSVALG.md) eller en kilde
    (`key` i `sources` fra GET /systems).

    Tall, ikke tekst: resultater sendes og returneres som tall i sekunder eller meter, med punktum
    som desimalskille. Formatering etter språk (komma på norsk) gjøres i klienten.

    Tilgang: åpent uten nøkkel i v1, med rate limiting per IP (B-4). API-nøkler med høyere grense
    for integrasjonspartnere (først minfriidrett.no) kommer senere og er ikke en del av v1.

    CORS: tillatte opphav er konfigurerbare. Standard er https://5kamp.minfriidrett.no og
    frontendens domene, se `x-cors-allowed-origins`.

    Caching (B-7): når `version` er oppgitt i forespørselen, svarer POST /calculate, /combined og
    /batch med `Cache-Control: public, max-age=31536000, immutable`. Uten `version` brukes nyeste
    versjon, og svaret har `Cache-Control: no-cache`.
  license:
    name: MIT
    identifier: MIT
x-cors-allowed-origins:
  - https://5kamp.minfriidrett.no
  - "<frontendens domene, settes ved deploy (AP-024)>"
servers:
  - url: /api/v1
tags:
  - name: katalog
    description: Hvilke tabeller, klasser og øvelser som finnes.
  - name: beregning
    description: Poeng for ett resultat, en mangekamp eller mange rader.
  - name: drift
    description: Helsesjekk.
  - name: tolkning
    description: Planlagt, ikke i v1. Tolker tekst fra Liveres, OpenTrack og minfriidrettsstatistikk.info (B-27).
paths:
  /health:
    get:
      tags: [drift]
      operationId: getHealth
      summary: Helsesjekk
      description: Svarer 200 når tjenesten kjører og alle motorene er lastet.
      responses:
        "200":
          description: Tjenesten kjører.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  value:
                    status: ok
                    package_version: 0.1.0
                    systems:
                      masters_combined_events: ["2023"]
                      tyrving: ["2014"]
                      wa_combined_events: ["2001"]
                      wma_age_grading: ["2023"]
