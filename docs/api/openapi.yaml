  /batch:
    post:
      tags: [beregning]
      operationId: calculateBatch
      summary: Mange rader i ett kall
      description: |
        1–2000 rader. Hver rad får eget svar i samme rekkefølge, med `status` og begrunnelse. Én
        ugyldig rad stopper aldri resten, og svaret er 200 så lenge selve forespørselen er gyldig.
        Rader uten resultat (`result: null`, for eksempel DNS eller DNF) får `no_result`.

        Status per rad:
        - `ok` — poeng beregnet, `calculation` er fylt ut.
        - `no_result` — ingen gyldig måling (`result` er null). `result_status` speiles i `message`.
        - `ambiguous_implement` — øvelsen har flere utstyrsvarianter i klassen, og `implement` mangler.
        - `implement_mismatch` — oppgitt utstyr er ikke det tabellen bruker for klassen. Det gis
          aldri poeng for feil utstyr.
        - `invalid` — alt annet (ukjent system, øvelse eller klasse, resultat 0, manuell tid der
          regelverket ikke har tillegg). `error` har koden fra feiltabellen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
            examples:
              blandet:
                value:
                  rows:
                    - row_id: r1
                      system: auto
                      event_id: sprint_200m
                      gender: M
                      age: 16
                      result: 23.79
                    - row_id: r2
                      system: tyrving
                      event_id: middle_800m
                      gender: M
                      age_class: "15"
                      result: null
