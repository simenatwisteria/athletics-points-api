  /interpret:
    post:
      tags: [tolkning]
      operationId: interpretRows
      summary: Tolk rå resultatlinjer (planlagt)
      x-status: planned
      description: |
        Planlagt etter B-27, bygges ikke i AP-021. Til da svarer endepunktet 501.

        Tar imot tekstfeltene slik de står i Liveres, OpenTrack og minfriidrettsstatistikk.info, og
        returnerer både tolkningen (kanoniske felt) og poengene, så feil kan spores. Utøverens klasse
        og øvelsens klasse er ikke det samme (`KU20 Spyd 600g` kan ha utøvere i J17), så poengene
        regnes per utøver. Mangler utstyr og klassen har én variant, brukes den. Er det flere, blir
        status `ambiguous_implement`. Vind og inne/ute leses, men påvirker ikke poengene i v1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterpretRequest"
            examples:
              liveres:
                value:
                  source: liveres
                  competition_date: "2026-06-14"
                  rows:
                    - row_id: "4711"
                      event_text: Kule G-15 (4,0kg)
                      class_text: G-15
                      result_text: 11,74
                      wind_text: null
      responses:
        "200":
          description: Tolkning og poeng per rad (når endepunktet er bygget).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterpretResult"
              examples:
                liveres:
                  summary: Stegene er utelatt i eksempelet (tom liste); API-et returnerer dem.
                  value:
                    rows:
                      - row_id: "4711"
                        status: ok
                        message: null
                        interpretation:
                          system: tyrving
                          event_id: shot_put
                          gender: M
                          age_class: "15"
                          implement: 4kg
                          implement_source: event_text
                          result: 11.74
                          result_status: null
                          manual_timing: false
                          wind: null
                          indoor: null
                        calculation:
                          points: 756
                          result_kind: points
                          scoring_system: tyrving
                          version: "2014"
                          event_id: shot_put
                          event_name: Kule
                          gender: M
                          age_class: "15"
                          implement: 4kg
                          result_used: 11.74
                          parameters:
                            h1000: 15.3
                            f1: 0.3
                            f2: 0.6
                            f3: 1.2
                          formula_type: three_interval
                          calculation_detail: 1000 − ((1530 − 1224) × 0,6 + (1224 − 1174) × 1,2) = 756,4 → 756
                          calculation_steps: []
                          within_plausible_range: true
        "501":
          description: Ikke bygget ennå (v1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                planlagt:
                  value:
                    error:
                      code: not_implemented
                      message: Tolkning av resultatlister er planlagt, men ikke bygget ennå.
                      details: null
components:
  parameters:
    SystemQuery:
      name: system
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/SystemId"
    VersionQuery:
      name: version
      in: query
      required: false
      description: Tabellversjon (B-5). Uten versjon brukes nyeste.
      schema:
        $ref: "#/components/schemas/Version"
  headers:
    CacheControl:
      description: "`public, max-age=31536000, immutable` når `version` er oppgitt (B-7), ellers `no-cache`."
      schema:
        type: string
  responses:
    InvalidRequest:
      description: |
        Forespørselen kan ikke beregnes. `code` sier hvorfor (se feiltabellen i `Error`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            ukjent_ovelse:
              value:
                error:
                  code: unknown_event
                  message: triple_jump finnes ikke for M i mangekamptabellen
                  details: null
            flere_varianter:
              value:
                error:
                  code: ambiguous_implement
                  message: "hurdles_110m M17 finnes med flere utstyrsvarianter; oppgi implement (91,4cm/9,14m, 100,0cm/9,14m)"
                  details:
                    implements:
                      - 91,4cm/9,14m
                      - 100,0cm/9,14m
            skjema:
              value:
                error:
                  code: validation_error
                  message: Feltet age er påkrevd når system er auto.
                  details:
                    field: age
    RateLimited:
      description: For mange forespørsler fra samme IP (B-4). `Retry-After` sier hvor mange sekunder.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            grense:
              value:
                error:
                  code: rate_limited
                  message: For mange forespørsler. Prøv igjen om litt.
                  details:
                    retry_after_seconds: 10
  schemas:
    SystemId:
      type: string
      description: Poengsystem. `series_table` finnes i katalogen, men er ikke klar.
      enum: [tyrving, wa_combined_events, masters_combined_events, wma_age_grading, series_table]
    SystemSelector:
      type: string
      description: Poengsystem, eller `auto` for tabellvalg etter alder (se `Selection`).
      enum: [auto, tyrving, wa_combined_events, masters_combined_events, wma_age_grading]
    Version:
      type: string
      description: Tabellversjon som årstall, for eksempel "2014" (B-5).
    Gender:
      type: string
      description: M = menn/gutter, F = kvinner/jenter.
      enum: [M, F]
    ClassType:
      type: string
      description: |
        Hvordan `age_class` skrives i systemet. API-et bruker motorens eget format og oversetter ikke:
        - `age` — alder i hele år som tekst: "10"–"19" i Tyrving (klassealder), "30"–"110" i WMA
          Age Grading (alder på konkurransedagen, BV-040).
        - `class` — "senior", og G15–G17 / J15–J17 i mangekamptabellen (BV-021, BV-023).
        - `masters_class` — femårsklasse: M35–M100 og W35–W100 (BV-032).
      enum: [age, class, masters_class]
    ResultKind:
      type: string
      description: |
        `points` — `points` er poengsummen. `age_adjusted_result` — WMA Age Grading gir ikke poeng:
        `points` er 0, og det aldersjusterte resultatet står i `result_used` (BV-041).
      enum: [points, age_adjusted_result]
    Category:
      type: string
      description: |
        Menygruppe, utledet av `event_id`: run (sprint_, middle_, distance_, half_marathon, marathon),
        hurdles (hurdles_, steeplechase), racewalk (racewalk_), jump (high_jump, pole_vault,
        long_jump, triple_jump og uten tilløp), throw (shot_put, discus, hammer, javelin,
        weight_throw, ball_throw, swing_ball).
      enum: [run, hurdles, racewalk, jump, throw]
    LocalizedText:
      type: object
      required: ["no", en]
      additionalProperties: false
      properties:
        "no":
          type: string
        en:
          type: string
    Health:
      type: object
      required: [status, package_version, systems]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        package_version:
          type: string
          description: Versjonen av athletics_scoring.
        systems:
          type: object
          description: Registrerte systemer med versjoner.
          additionalProperties:
            type: array
            items:
              type: string
    SourceDocument:
      type: object
      description: Kildedokument (B-24). `key` er det `ref` i beregningsstegene peker til.
      required: [key, title, publisher, official_page, document_url, local_path, sha256, retrieved]
      additionalProperties: false
      properties:
        key:
          type: string
        title:
          type: string
        publisher:
          type: string
        official_page:
          type: [string, "null"]
        document_url:
          type: [string, "null"]
        local_path:
          type: [string, "null"]
          description: Sti i repoet (sources/…). Null for kilder som ikke er sjekket inn (B-23).
        sha256:
          type: [string, "null"]
        retrieved:
          type: [string, "null"]
          description: Dato kilden ble lastet ned (ÅÅÅÅ-MM-DD).
    SystemVersion:
      type: object
      required: [version, sources]
      additionalProperties: false
      properties:
        version:
          $ref: "#/components/schemas/Version"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceDocument"
    SystemInfo:
      type: object
      required: [id, name, description, group, ready, class_type, classes, supports_combined, result_kind, latest_version, versions]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/SystemId"
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        group:
          type: string
          enum: [youth, senior, masters]
        ready:
          type: boolean
          description: Tabellen kan brukes til beregning. Ikke klare tabeller vises med melding i frontenden.
        class_type:
          $ref: "#/components/schemas/ClassType"
        classes:
          type: object
          description: Klassene motoren tar imot, per kjønn.
          required: [M, F]
          additionalProperties: false
          properties:
            M:
              type: array
              items:
                type: string
            F:
              type: array
              items:
                type: string
        supports_combined:
          type: boolean
          description: POST /combined virker for systemet. Tyrving bare til og med 14 år (BV-015).
        result_kind:
          $ref: "#/components/schemas/ResultKind"
        latest_version:
          type: [string, "null"]
        versions:
          type: array
          items:
            $ref: "#/components/schemas/SystemVersion"
    InputSpec:
      type: object
      description: Hvordan resultatet tastes inn. Rimelig område er brukerhjelp, ikke en regel.
      required: [measure, resolution, uses_minutes, manual_timing_allowed, plausible_min, plausible_max]
      additionalProperties: false
      properties:
        measure:
          type: string
          description: time = sekunder, distance = meter.
          enum: [time, distance]
        resolution:
          type: number
          description: Minste enhet som teller (0.01 eller 0.1).
        uses_minutes:
          type: boolean
          description: Tiden vises naturlig som minutter og sekunder. Sendes likevel som sekunder totalt.
        manual_timing_allowed:
          type: boolean
        plausible_min:
          type: number
        plausible_max:
          type: number
    EventEntry:
      type: object
      required: [system, version, event_id, name, category, gender, age_class, implement, formula_type, input, points_1000_result]
      additionalProperties: false
      properties:
        system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/Version"
        event_id:
          type: string
          description: Felles øvelses-ID på tvers av systemene, for eksempel sprint_200m eller shot_put.
        name:
          $ref: "#/components/schemas/LocalizedText"
        category:
          $ref: "#/components/schemas/Category"
        gender:
          $ref: "#/components/schemas/Gender"
        age_class:
          type: string
        implement:
          type: [string, "null"]
          description: Redskapsvekt eller hekkehøyde/-avstand, for eksempel 4kg eller 91,4cm/9,14m. Null når øvelsen ikke har utstyr.
        formula_type:
          type: string
        input:
          $ref: "#/components/schemas/InputSpec"
        points_1000_result:
          type: [number, "null"]
          description: Resultatet som gir 1000 poeng (grå referanse i resultatfeltet). Null i WMA Age Grading.
    CalculateRequest:
      type: object
      description: |
        `age_class` er påkrevd, unntatt med `system: auto`, som krever `age` i stedet. `result` er
        sekunder totalt for tider (2:04,56 = 124.56) og meter for lengder. Hvilken av dem styres av
        `input.measure` for øvelsen.
      required: [system, event_id, gender, result]
      additionalProperties: false
      properties:
        system:
          $ref: "#/components/schemas/SystemSelector"
        version:
          $ref: "#/components/schemas/Version"
        event_id:
          type: string
        gender:
          $ref: "#/components/schemas/Gender"
        age_class:
          type: string
        age:
          type: integer
          minimum: 10
          maximum: 110
          description: "Bare med `system: auto`. Klassealder, det vil si alderen utøveren fyller i konkurranseåret."
        implement:
          type: string
          description: Må oppgis når øvelsen har flere utstyrsvarianter i klassen.
        result:
          type: number
        manual_timing:
          type: boolean
          default: false
          description: Manuell tidtaking. Gir tillegg der regelverket har det, ellers 422.
    CombinedEventRequest:
      type: object
      required: [event_id, result]
      additionalProperties: false
      properties:
        event_id:
          type: string
        implement:
          type: string
        result:
          type: number
        manual_timing:
          type: boolean
          default: false
    CombinedRequest:
      type: object
      required: [system, gender, events]
      additionalProperties: false
      properties:
        system:
          $ref: "#/components/schemas/SystemSelector"
        version:
          $ref: "#/components/schemas/Version"
        gender:
          $ref: "#/components/schemas/Gender"
        age_class:
          type: string
        age:
          type: integer
          minimum: 10
          maximum: 110
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/CombinedEventRequest"
    CalculationStep:
      type: object
      required: [label, value, formula, ref]
      additionalProperties: false
      properties:
        label:
          type: string
          description: Maskinlesbart navn på steget, for eksempel points_raw.
        value:
          type: number
        formula:
          type: string
          description: Lesbar forklaring på norsk, med desimalkomma.
        ref:
          type: [string, "null"]
          description: BV-nummer i docs/BEREGNINGSVALG.md eller `key` til en kilde i GET /systems.
    Selection:
      type: object
      description: |
        Hvilken tabell `system: auto` valgte. Reglene: under 15 år Tyrving med alderen som klasse
        (10–14); 15–17 år mangekamptabellen med G/J15–17; fra 18 år mangekamptabellen senior (BV-021).
        Masters brukes bare når klienten ber om det, fordi klubbstevner ofte bruker senior for alle voksne.
      required: [requested_system, age, system, age_class, rule, ref]
      additionalProperties: false
      properties:
        requested_system:
          type: string
          enum: [auto]
        age:
          type: integer
        system:
          $ref: "#/components/schemas/SystemId"
        age_class:
          type: string
        rule:
          type: string
        ref:
          type: string
    Calculation:
      type: object
      description: Svar på én beregning. Tilsvarer `ScoreResult` i athletics_scoring, pluss `result_kind` og `selection`.
      required: [points, result_kind, scoring_system, version, event_id, event_name, gender, age_class, implement, result_used, parameters, formula_type, calculation_detail, calculation_steps, within_plausible_range]
      additionalProperties: false
      properties:
        points:
          type: integer
          minimum: 0
        result_kind:
          $ref: "#/components/schemas/ResultKind"
        scoring_system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/Version"
        event_id:
          type: string
        event_name:
          type: string
          description: Norsk navn fra motoren. Engelsk navn står i GET /events.
        gender:
          $ref: "#/components/schemas/Gender"
        age_class:
          type: string
        implement:
          type: [string, "null"]
        result_used:
          type: number
          description: Resultatet som faktisk ble regnet med, etter tillegg, avrunding og aldersjustering.
        parameters:
          type: object
          additionalProperties:
            type: number
        formula_type:
          type: string
        calculation_detail:
          type: string
        calculation_steps:
          type: array
          items:
            $ref: "#/components/schemas/CalculationStep"
        within_plausible_range:
          type: boolean
        selection:
          $ref: "#/components/schemas/Selection"
    CombinedResult:
      type: object
      required: [total, scoring_system, version, gender, age_class, events]
      additionalProperties: false
      properties:
        total:
          type: integer
        scoring_system:
          $ref: "#/components/schemas/SystemId"
        version:
          $ref: "#/components/schemas/Version"
        gender:
          $ref: "#/components/schemas/Gender"
        age_class:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/Calculation"
        selection:
          $ref: "#/components/schemas/Selection"
    BatchRow:
      type: object
      description: Som CalculateRequest, men `result` kan være null (ingen gyldig måling).
      required: [system, event_id, gender, result]
      additionalProperties: false
      properties:
        row_id:
          type: string
          description: Klientens egen ID, speiles i svaret.
        system:
          $ref: "#/components/schemas/SystemSelector"
        version:
          $ref: "#/components/schemas/Version"
        event_id:
          type: string
        gender:
          $ref: "#/components/schemas/Gender"
        age_class:
          type: string
        age:
          type: integer
          minimum: 10
          maximum: 110
        implement:
          type: string
        result:
          type: [number, "null"]
        result_status:
          type: string
          description: Klientens status når resultat mangler, for eksempel DNS, DNF, NM eller DQ.
        manual_timing:
          type: boolean
          default: false
    BatchRequest:
      type: object
      required: [rows]
      additionalProperties: false
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            $ref: "#/components/schemas/BatchRow"
    RowStatus:
      type: string
      enum: [ok, no_result, ambiguous_implement, implement_mismatch, invalid]
    BatchRowResult:
      type: object
      required: [row_id, status, message, error, calculation]
      additionalProperties: false
      properties:
        row_id:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/RowStatus"
        message:
          type: [string, "null"]
          description: Begrunnelse på norsk når status ikke er ok.
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorBody"
            - type: "null"
        calculation:
          oneOf:
            - $ref: "#/components/schemas/Calculation"
            - type: "null"
    BatchResult:
      type: object
      required: [summary, rows]
      additionalProperties: false
      properties:
        summary:
          type: object
          description: Antall rader per status.
          required: [ok, no_result, ambiguous_implement, implement_mismatch, invalid]
          additionalProperties: false
          properties:
            ok:
              type: integer
            no_result:
              type: integer
            ambiguous_implement:
              type: integer
            implement_mismatch:
              type: integer
            invalid:
              type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BatchRowResult"
    InterpretRow:
      type: object
      required: [row_id, event_text, class_text, result_text]
      additionalProperties: false
      properties:
        row_id:
          type: string
        event_text:
          type: string
          description: Øvelsen slik den står i kilden, for eksempel «Kule G-15 (4,0kg)» eller «MU20 Kule 6,0kg».
        class_text:
          type: string
          description: Utøverens klasse, for eksempel «G-15», «J18/19», «M60».
        result_text:
          type: string
          description: Resultatet som tekst, for eksempel «11,74», «1,48,98», «2:21.47», «DNS».
        wind_text:
          type: [string, "null"]
        gender:
          $ref: "#/components/schemas/Gender"
        indoor:
          type: [boolean, "null"]
    InterpretRequest:
      type: object
      required: [source, rows]
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [liveres, opentrack, minfriidrettsstatistikk]
        competition_date:
          type: string
          description: ÅÅÅÅ-MM-DD. Brukes til alder på konkurransedagen der systemet krever det.
        rows:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            $ref: "#/components/schemas/InterpretRow"
    Interpretation:
      type: object
      required: [system, event_id, gender, age_class, implement, implement_source, result, result_status, manual_timing, wind, indoor]
      additionalProperties: false
      properties:
        system:
          type: [string, "null"]
        event_id:
          type: [string, "null"]
        gender:
          oneOf:
            - $ref: "#/components/schemas/Gender"
            - type: "null"
        age_class:
          type: [string, "null"]
        implement:
          type: [string, "null"]
        implement_source:
          type: string
          description: Hvor utstyret kom fra.
          enum: [event_text, class_default, missing]
        result:
          type: [number, "null"]
        result_status:
          type: [string, "null"]
          description: DNS, DNF, NM, DQ eller «-» når det ikke finnes et resultat.
        manual_timing:
          type: boolean
        wind:
          type: [number, "null"]
        indoor:
          type: [boolean, "null"]
    InterpretRowResult:
      type: object
      required: [row_id, status, message, interpretation, calculation]
      additionalProperties: false
      properties:
        row_id:
          type: string
        status:
          type: string
          enum: [ok, no_result, ambiguous_implement, implement_mismatch, invalid, uninterpretable]
        message:
          type: [string, "null"]
        interpretation:
          $ref: "#/components/schemas/Interpretation"
        calculation:
          oneOf:
            - $ref: "#/components/schemas/Calculation"
            - type: "null"
    InterpretResult:
      type: object
      required: [rows]
      additionalProperties: false
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/InterpretRowResult"
    ErrorBody:
      type: object
      description: |
        Felles feilformat. `message` er på norsk. Feiltyper fra athletics_scoring og HTTP-status:
        - UnknownSystemError → 422 `unknown_system`
        - UnknownVersionError → 422 `unknown_version`
        - UnknownEventError → 422 `unknown_event` (ukjent øvelse, klasse eller kombinasjon)
        - AmbiguousEventError → 422 `ambiguous_implement`
        - ImplementMismatchError (underklasse av UnknownEventError, feil utstyr) → 422 `implement_mismatch`
        - InvalidResultError → 422 `invalid_result`
        - UnsupportedManualTimingError → 422 `unsupported_manual_timing`
        - InvalidCombinedEventError → 422 `invalid_combined_event`
        - ugyldig forespørsel (skjema) → 422 `validation_error`
        - for mange forespørsler → 429 `rate_limited`
        - /interpret i v1 → 501 `not_implemented`
        - DuplicateEngineError og alt annet uventet → 500 `internal_error`
      required: [code, message, details]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [unknown_system, unknown_version, unknown_event, ambiguous_implement, implement_mismatch, invalid_result, unsupported_manual_timing, invalid_combined_event, validation_error, rate_limited, not_implemented, internal_error]
        message:
          type: string
        details:
          type: [object, "null"]
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
